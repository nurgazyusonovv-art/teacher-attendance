name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check app tests scripts
      - run: python -m compileall -q app tests scripts
      - run: pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: teacher_test
          POSTGRES_PASSWORD: teacher_test_password
          POSTGRES_DB: teacher_integrity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teacher_test -d teacher_integrity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: test-only-secret-key-at-least-32-characters
      CORS_ORIGINS: '["http://localhost"]'
      DB_SSL_REQUIRE: "false"
      DATABASE_URL: postgresql+asyncpg://teacher_test:teacher_test_password@localhost:5432/teacher_integrity_test
      SYNC_DATABASE_URL: postgresql://teacher_test:teacher_test_password@localhost:5432/teacher_integrity_test
      ALLOW_BOOTSTRAP_SEED: "true"
      SEED_ADMIN_PASSWORD: ci-admin-test-password
      SEED_TEACHER_PASSWORD: ci-teacher-test-password
      SEED_DEMO_PASSWORD: ci-demo-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python scripts/seed.py
      - run: python scripts/postgres_concurrency_check.py

  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [mobile, web_admin]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - if: matrix.project == 'mobile'
        run: flutter build apk --debug
      - if: matrix.project == 'web_admin'
        run: flutter build web --release

  mobile-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug

  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag teacher-backend-ci backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: teacher_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teacher_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teacher_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-teacher_attendance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacher_user -d teacher_attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teacher_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Teacher Attendance API"
      ENVIRONMENT: "production"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-teacher_user}:${POSTGRES_PASSWORD:-teacher_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-teacher_attendance_db}"
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_production_2026_change_in_prod}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      TIMEZONE: "Asia/Bishkek"
    ports:
      - "8000:8000"

  web_admin:
    build:
      context: ./web_admin
      dockerfile: Dockerfile
    container_name: teacher_web_admin
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:

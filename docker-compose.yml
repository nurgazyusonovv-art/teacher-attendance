services:
  postgres:
    image: postgres:16-alpine
    container_name: teacher_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teacher_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-teacher_attendance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teacher_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Teacher Attendance API"
      ENVIRONMENT: "production"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-teacher_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-teacher_attendance_db}"
      SYNC_DATABASE_URL: "postgresql://${POSTGRES_USER:-teacher_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-teacher_attendance_db}"
      # The bundled PostgreSQL service uses Compose's private network without TLS.
      # Hosted databases must set this to true (Render does so in render.yaml).
      DB_SSL_REQUIRE: "false"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      TIMEZONE: "Asia/Bishkek"
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  web_admin:
    build:
      context: ./web_admin
      dockerfile: Dockerfile
    container_name: teacher_web_admin
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:

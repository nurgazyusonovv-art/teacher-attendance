[project]
name = "teacher-attendance-backend"
version = "0.1.0"
description = "Teacher Attendance API backend"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Keep the same correctness checks locally and in CI; do not inherit runner defaults.
select = ["E4", "E7", "E9", "F"]

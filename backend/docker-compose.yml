services:
  postgres:
    image: postgres:16-alpine
    container_name: teacher_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: teacher_attendance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teacher_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/teacher_attendance
      SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/teacher_attendance
      SECRET_KEY: change-this-to-a-super-secret-key-in-prod
      ENVIRONMENT: development
      DEBUG: "True"
      TIMEZONE: "Asia/Bishkek"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

services:
  - type: web
    name: teacher-attendance-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: TIMEZONE
        value: Asia/Bishkek
      - key: DEFAULT_ALLOWED_RADIUS_METERS
        value: "150.0"
      - key: DEFAULT_MAX_GPS_ACCURACY_METERS
        value: "80.0"
      - key: CORS_ORIGINS
        sync: false
